name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Production build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/client/next-landing-page
    env:
      # Disposable CI session signing key; no production secrets.
      BETTER_AUTH_SECRET: skytime-ci-only-disposable-session-signing-key
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/client/next-landing-page/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check types
        run: npm run type-check

      - name: Migrate disposable database
        run: |
          npm run auth:migrate
          npm run db:migrate

      - name: Verify migrations are repeatable
        run: |
          npm run auth:migrate
          npm run db:migrate

      - name: Build production application
        run: npm run build

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run API, MCP and browser integration tests
        run: npm run test:integration

      - name: Keep integration diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics
          path: |
            src/client/next-landing-page/test-results
            src/client/next-landing-page/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      # A fresh server avoids sharing authentication rate limits with the
      # integration fixtures while retaining production auth protections.
      - name: Run desktop and mobile smoke tests
        run: npm run demo:screenshots

      - name: Keep smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-diagnostics
          path: |
            src/client/next-landing-page/test-results
            src/client/next-landing-page/playwright-report
          if-no-files-found: ignore
          retention-days: 7
